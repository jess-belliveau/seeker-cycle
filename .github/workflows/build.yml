name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M-series)
          - os: macos-latest
            label: mac-arm64
            electron_arch: arm64
            artifact_glob: dist/*.dmg

          # Intel Mac (cross-compiled on Apple Silicon runner)
          - os: macos-latest
            label: mac-x64
            electron_arch: x64
            artifact_glob: dist/*.dmg

          # Windows
          - os: windows-latest
            label: win-x64
            electron_arch: x64
            artifact_glob: dist/*.exe

          # Linux
          - os: ubuntu-latest
            label: linux-x64
            electron_arch: x64
            artifact_glob: dist/*.AppImage

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # libbluetooth-dev / libudev-dev are needed to compile @abandonware/noble on Linux
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y libusb-1.0-0-dev libudev-dev libbluetooth-dev

      # npm ci runs postinstall which calls electron-rebuild for @abandonware/noble
      - name: Install dependencies
        run: npm ci
        env:
          npm_config_arch: ${{ matrix.electron_arch }}

      - name: Build renderer + main
        run: npx electron-vite build

      - name: Package with electron-builder
        run: npx electron-builder --${{ matrix.os == 'windows-latest' && 'win' || matrix.os == 'ubuntu-latest' && 'linux' || 'mac' }} --${{ matrix.electron_arch }}
        env:
          # Disable code signing — remove these if you set up a cert
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: seeker-cycle-${{ matrix.label }}
          path: ${{ matrix.artifact_glob }}
          retention-days: 30
          if-no-files-found: error

  # If this was triggered by a version tag, attach artifacts to a GitHub release
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
